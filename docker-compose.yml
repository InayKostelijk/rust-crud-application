
services:
  db:
      image: mariadb:latest
      container_name: mariadb
      environment:
        MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
        MARIADB_DATABASE: rust_crud_db
      volumes:
        - mariadb_volume:/var/lib/mysql

      networks:
        - mariadb_network
      ports:
        - 3306:3306
    

volumes:
  mariadb_volume:
    
networks:
  mariadb_network:
        

