[package]
name = "rust-crud-application"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = {version = "0.9", features = ["runtime-tokio", "tls-rustls","mysql","macros","bigdecimal" ]}
serde = {version= "1", features = ["derive"]}
serde_json="1"
dotenvy= "0.15"
thiserror = "2"
anyhow = "1.0.104"
async-trait = "0.1.92"


