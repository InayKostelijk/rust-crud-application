[package]
name = "rust-crud-application"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8" 
tokio = { version = "1", features = ["full"] }
sqlx = {version = "0.9", features = ["runtime-tokio", "tls-rustls","mysql","macros" ]}
serde = {version= "1", features = ["derive"]}
serde_json="1"
dotenvy= "0.15"

